[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Version has ONE source: speaker_align/__init__.py, read from there by
# hatchling. Its sibling whisper-guard kept a second copy here, one of the
# two was bumped, and 0.3.0 shipped to PyPI declaring Version: 0.3.0 while
# the wheel reported __version__ = "0.2.0". Fixed before the first release
# rather than after.
[tool.hatch.version]
path = "speaker_align/__init__.py"

# hatchling does not consult .gitignore for sdists, so a local virtualenv
# would otherwise be packaged and shipped (whisper-guard 0.3.0 went out at
# 1.5 MB, 520 of its files a .venv-test directory).
[tool.hatch.build.targets.sdist]
exclude = [".venv", ".venv/**", ".venv-*", ".venv-*/**", "dist", "build", ".pytest_cache", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["speaker_align"]

[project]
name = "speaker-align"
dynamic = ["version"]
description = "Attach speaker labels to transcript segments by temporal overlap"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Hevin Yeh", email = "vulture.s.tw@gmail.com" }]
keywords = ["diarization", "speaker", "transcript", "alignment", "asr", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
pyannote = ["pyannote.audio>=3.1"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/vulture-s/speaker-align"
Repository = "https://github.com/vulture-s/speaker-align"
