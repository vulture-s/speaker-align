[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speaker-align"
version = "0.1.0"
description = "Attach speaker labels to transcript segments by temporal overlap"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Hevin Yeh", email = "vulture.s.tw@gmail.com" }]
keywords = ["diarization", "speaker", "transcript", "alignment", "asr", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
pyannote = ["pyannote.audio>=3.1"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/vulture-s/speaker-align"
Repository = "https://github.com/vulture-s/speaker-align"
